audiodecoder:
  stream_download_path: "http://<>/streams" #`URL` path to download the audio test streams
  input_streams_path: "assets/streams/input" #Target path where input streams are stored
  reference_streams_path: "assets/streams/reference/" #Target path for reference PCM streams
  L3:
    Decode_Trim:
      Controls:
        delay_between_decode_calls: 5
        stop_start_pts: -1
        signal_discontinuity_pts: -1
        flush_pts: -1
        flush_reset_pts: -1
        eos_pts: -1
        sink_eos_pts: -1
        sink_flush_pts: -1
      Inputs:
        Streams:
          - Name: tones_48k_2_256_aac
            PTS:
              - 0
              - 21333333
              - 42666667
              - 64000000
              - 85333333
              - 106666667
              - 128000000
              - 149333333
              - 170666667
              - 192000000
            trim_pts: 192000000
            trim_removed: 11333333
            trim:
              - 10000000
              - 20000000
            rms_diff_threshold: 0.5
            decode_time_threshold: 100000
          - Name: tones_48k_2_192_ac3
            PTS:
              - 0
              - 32000000
              - 64000000
              - 96000000
              - 128000000
              - 160000000
              - 192000000
              - 224000000
              - 256000000
              - 288000000
            trim_pts: 288000000
            trim_removed: 22000000
            trim:
              - 10000000
              - 20000000
            rms_diff_threshold: 0.5
            decode_time_threshold: 100000
